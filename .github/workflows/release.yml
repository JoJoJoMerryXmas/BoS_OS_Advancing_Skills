name: Release

on:
  push:
    branches:
      - main
    paths:
      - '*/SKILL.md'
      - 'README.md'
      - '.github/workflows/release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release changed skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          CHANGED_DIRS=$(git diff --name-only HEAD~1 HEAD | grep -E '^[^/]+/SKILL\.md$' | xargs -n1 dirname | sort -u || true)

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No skill SKILL.md changed in this push — nothing to release."
            exit 0
          fi

          MSG=$(git log -1 --pretty=%B)

          for DIR in $CHANGED_DIRS; do
            if [ ! -f "$DIR/SKILL.md" ]; then
              echo "Skipping $DIR — no SKILL.md found (deleted in this push?)."
              continue
            fi

            VERSION=$(grep "version:" "$DIR/SKILL.md" | head -1 | awk '{print $2}')
            if [ -z "$VERSION" ]; then
              echo "Skipping $DIR — no version: line found in SKILL.md."
              continue
            fi

            TAG="${DIR}-v${VERSION}"
            echo "Processing $DIR — version $VERSION — tag $TAG"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists — skipping."
              continue
            fi

            zip -r "${DIR}.skill" "${DIR}/"
            ls -lh "${DIR}.skill"

            gh release create "$TAG" "${DIR}.skill" \
              --title "$TAG" \
              --notes "## Changes
        ${MSG}"

            echo "Released $TAG"
          done
