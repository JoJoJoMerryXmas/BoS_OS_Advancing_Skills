name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'signalprocessing/SKILL.md'
      - 'README.md'
      - '.github/workflows/release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from SKILL.md
        id: version
        run: |
          VERSION=$(grep "version:" signalprocessing/SKILL.md | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view v${{ steps.version.outputs.version }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .skill files
        if: steps.check_release.outputs.exists == 'false'
        run: |
          zip -r signalprocessing.skill signalprocessing/
          ls -lh *.skill

      - name: Get commit message
        id: commit_msg
        run: |
          MSG=$(git log -1 --pretty=%B)
          MSG="${MSG//'%'/'%25'}"
          MSG="${MSG//$'\n'/'%0A'}"
          MSG="${MSG//$'\r'/'%0D'}"
          echo "message=$MSG" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ## Changes

            ${{ steps.commit_msg.outputs.message }}
          files: |
            signalprocessing.skill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
