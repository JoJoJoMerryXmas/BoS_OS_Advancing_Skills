name: Release

on:
  push:
    branches:
      - main
    paths:
      - '*/SKILL.md'
      - 'README.md'
      - '.github/workflows/release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release changed skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # Determine the diff range: use the push event's full before/after
          # SHAs so multi-commit pushes (or a fix commit landing in a separate
          # push from the commit it fixes) are still correctly detected, not
          # just the single most recent commit vs its parent. Falls back when
          # there's no usable before-SHA: a brand new branch (before is
          # all-zeros) or a rewritten history where the before commit isn't
          # reachable (e.g. a force-push). Fixed 2026-07-24 after HEAD~1 HEAD
          # missed a skill addition that landed in an earlier push than its
          # own YAML fix. See MISSION-014 BLOCK-3 follow-up, Registry Known
          # Issue #7.
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          EMPTY_TREE="4b825dc642cb6eb9a060e54bf8d69288fbee4904"

          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$ZERO_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            DIFF_RANGE="$BEFORE_SHA $AFTER_SHA"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_RANGE="HEAD~1 HEAD"
          else
            DIFF_RANGE="$EMPTY_TREE HEAD"
          fi

          echo "Diffing range: $DIFF_RANGE"
          CHANGED_DIRS=$(git diff --name-only $DIFF_RANGE | grep -E '^[^/]+/SKILL\.md$' | xargs -r -n1 dirname | sort -u || true)

          if [ -z "$CHANGED_DIRS" ]; then
            echo "No skill SKILL.md changed in this push — nothing to release."
            exit 0
          fi

          MSG=$(git log -1 --pretty=%B)

          for DIR in $CHANGED_DIRS; do
            if [ ! -f "$DIR/SKILL.md" ]; then
              echo "Skipping $DIR — no SKILL.md found (deleted in this push?)."
              continue
            fi

            VERSION=$(grep "version:" "$DIR/SKILL.md" | head -1 | awk '{print $2}')
            if [ -z "$VERSION" ]; then
              echo "Skipping $DIR — no version: line found in SKILL.md."
              continue
            fi

            TAG="${DIR}-v${VERSION}"
            echo "Processing $DIR — version $VERSION — tag $TAG"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists — skipping."
              continue
            fi

            # Package the skill folder's CONTENTS at the zip root, not the folder
            # itself — `zip -r x.skill dir/` wraps everything one level deeper
            # (dir/SKILL.md inside the zip), which breaks Cowork's skill uploader:
            # it looks for SKILL.md at the zip's top level and fails with a
            # nested/secondary-level error. Same bug as BoS_OS_Start pre-v2.4.0;
            # ported here 2026-08-12.
            (cd "$DIR" && zip -r "../${DIR}.skill" .)
            ls -lh "${DIR}.skill"

            # Guard against the nested-folder bug regressing: the .skill must have
            # SKILL.md at its root, not inside a subfolder. Fails the release if
            # packaging goes wrong again.
            if unzip -l "${DIR}.skill" | awk '{print $4}' | grep -qx "SKILL.md"; then
              echo "OK: ${DIR}.skill has SKILL.md at its root"
            else
              echo "FAIL: ${DIR}.skill does not have SKILL.md at its root — packaging is nested"
              unzip -l "${DIR}.skill"
              exit 1
            fi

            NOTES=$(printf '## Changes\n%s' "$MSG")
            gh release create "$TAG" "${DIR}.skill" \
              --title "$TAG" \
              --notes "$NOTES"

            echo "Released $TAG"
          done
